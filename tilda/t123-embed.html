<!-- Character typology test: paste into Tilda block T123 on page /test -->
<style>
  /* Break out of Tilda's column container so the test spans the full page. */
  #ctt-wrap { width: 100vw; margin-left: calc(50% - 50vw); }
  #ctt-frame { width: 100%; border: 0; display: block; }
</style>
<div id="ctt-wrap">
  <iframe id="ctt-frame"
          src="https://fsv2k5.github.io/character-typology-test/"
          title="Тест: какой у вас тип характера"
          style="height:100vh"
          scrolling="no"
          allow="clipboard-write"></iframe>
</div>
<script>
(function () {
  var frame = document.getElementById("ctt-frame");
  if (!frame) return;

  // The test posts its content height on every screen change. Grow to fit, but
  // never shrink below the viewport, so short screens do not leave a gap.
  window.addEventListener("message", function (e) {
    if (e.origin !== "https://fsv2k5.github.io") return;
    var d = e.data;
    if (!d || d.type !== "ctt:height") return;
    var h = parseInt(d.height, 10);
    if (h > 0) frame.style.height = Math.max(h, window.innerHeight) + "px";
  });
})();
</script>
